<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>畫檢 AOI 監控平台</title>
<style>
:root{
  /* ── Manager Platform / AOI Calculator 同一套設計語言：藍海軍藍 + 玻璃擬態（淺色 only）── */
  --blue:#1f4e96; --blue2:#2f6fd0;
  --bg:#eef2f7; --surf:#ffffff; --surf2:#f2f6fc; --border:#dde4ee; --border2:#c9d3e1;
  --text:#1c2b45; --sub:#6b7a90; --accent:#2f6fd0; --accent-deep:#1f4e96;
  --warn:#e0563f; --green:#36b37e; --amber:#d99400;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.84); --glass-line:rgba(255,255,255,.65);
  --glass-blur:saturate(180%) blur(20px);
  --rad:12px; --rad-sm:9px;
  --shadow:0 1px 2px rgba(30,50,90,.06),0 6px 20px rgba(30,50,90,.07);
  --shadow-2:0 8px 30px rgba(30,50,90,.14);
  /* PDCA 階段色 */
  --sP:#7b6fd6; --sD:#2f6fd0; --sC:#d99400; --sA:#36b37e;
  /* 能力狀態色 */
  --ok:#36b37e; --dev:#d99400; --gap:#e0563f; --na:#c3ccd9;
  --req:#eaf1fd;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Microsoft JhengHei",'Segoe UI',sans-serif;
  color:var(--text);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(47,111,208,.18), transparent 60%),
    radial-gradient(900px 650px at 100% 0%, rgba(179,157,219,.15), transparent 55%),
    radial-gradient(800px 700px at 50% 120%, rgba(54,179,126,.10), transparent 60%),
    linear-gradient(160deg,#eef3fb,#e7ecf6 55%,#eaf1f5);
  background-attachment:fixed;}
button{font:inherit;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}

/* ── Header ── */
header{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:linear-gradient(120deg,rgba(31,78,150,.95),rgba(47,111,208,.92));color:#fff;
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-bottom:1px solid rgba(255,255,255,.18);box-shadow:0 4px 24px rgba(20,40,80,.18);}
header .logo{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);flex-shrink:0;}
.ttl h1{font-size:14px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.ver-pill{display:inline-block;font-size:10px;font-weight:700;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);
  padding:0 7px;border-radius:999px;margin-left:6px;vertical-align:1px;}
/* 版本號＋分頁同一個框（與 AOI Calculator 的 .hdr-vk 同一套） */
.hdr-vk{display:flex;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);border-radius:999px;margin-left:14px;flex-shrink:0;}
.ver-wrap{position:relative;display:flex;}
.ver-btn{display:flex;align-items:center;border-right:1px solid rgba(255,255,255,.35);color:#fff;
  font-size:12px;font-weight:700;letter-spacing:.2px;padding:0 12px 0 13px;white-space:nowrap;
  border-top:0;border-bottom:0;border-left:0;background:none;border-radius:999px 0 0 999px;cursor:pointer;transition:background .15s;}
/* 版本切換選單（與 AOI Calculator 同一套）：正式版在網址根目錄、Beta 在 beta/，兩版共用同一份雲端資料 */
.ver-btn:hover,.ver-wrap.open .ver-btn{background:rgba(255,255,255,.18);}
.ver-btn i{font-style:normal;font-size:10px;opacity:.85;margin-left:5px;}
.ver-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:272px;z-index:60;background:#fff;color:var(--text);
  border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);padding:5px;}
.ver-wrap.open .ver-menu{display:block;}
.ver-it{display:block;position:relative;padding:8px 10px 8px 27px;border-radius:7px;font-size:12.5px;font-weight:600;line-height:1.35;white-space:nowrap;color:var(--text);text-decoration:none;}
a.ver-it:hover{background:var(--surf2);color:var(--accent-deep);}
.ver-it.on{color:var(--accent-deep);cursor:default;} .ver-it.on::before{content:'✓';position:absolute;left:10px;top:8px;}
.ver-it small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px;}
.ver-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap;}
.ver-menu button:hover{background:var(--surf2);color:var(--accent-deep);}
.ver-note{font-size:11px;color:var(--sub);line-height:1.5;padding:7px 10px 5px;margin-top:4px;border-top:1px solid var(--border);}
.fab-menu .fab-ver{display:none;}   /* 手機看不到標題列的版本號，從右下角 i 切換 */
.nav{display:flex;padding:2px;flex-shrink:0;}
.nav button{border:0;background:none;color:rgba(255,255,255,.88);font-size:12px;font-weight:600;padding:5px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.nav button:hover{background:rgba(255,255,255,.14);}
.nav button.on{background:#fff;color:var(--accent-deep);}
.nav button i{font-style:normal;}
.nav button:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(1);} .nav button:disabled:hover{background:none;}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;}
.hbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;}
.hbtn:hover{background:rgba(255,255,255,.28);}
.hbtn.round{width:30px;padding:0;justify-content:center;}

/* ── Layout ── */
main{padding:16px 18px 48px;max-width:1480px;margin:0 auto;}
main.wide{max-width:none;padding-bottom:12px;}   /* 能力矩陣：表格自己捲動，整頁不捲 */
.page{display:none;} .page.on{display:block;}
.card{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-line);border-radius:var(--rad);box-shadow:var(--shadow);}
.sec-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:14px;white-space:nowrap;font-weight:800;margin:22px 2px 10px;}
.sec-t:first-child{margin-top:4px;}
.sec-t small{font-size:11px;font-weight:500;color:var(--sub);white-space:normal;}
.sec-t .r{margin-left:auto;display:flex;gap:6px;align-items:center;}
.muted{color:var(--sub);}
.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--rad-sm);margin-bottom:12px;font-size:12px;
  background:color-mix(in srgb,var(--amber) 11%,#fff);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);color:#7a5600;}
.banner .btn{margin-left:auto;}

/* ── Buttons / inputs ── */
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border2);
  background:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text);}
.btn:hover{border-color:var(--accent);color:var(--accent-deep);}
.btn.pri{background:linear-gradient(180deg,#3a7be0,#2a64c4);border-color:#2a64c4;color:#fff;box-shadow:0 2px 8px rgba(31,78,150,.25);}
.btn.pri:hover{filter:brightness(1.06);color:#fff;}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);}
.btn.danger:hover{background:color-mix(in srgb,var(--warn) 8%,#fff);}
.btn.sm{height:26px;padding:0 9px;font-size:11px;}
.btn.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.in{height:30px;border:1px solid var(--border2);border-radius:8px;padding:0 9px;background:#fff;font-size:12px;min-width:0;}
textarea.in{height:auto;min-height:60px;padding:6px 9px;resize:vertical;line-height:1.5;}
.in:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent);}
.x{border:0;background:none;cursor:pointer;color:var(--sub);font-size:16px;line-height:1;padding:3px 6px;border-radius:6px;}
.x:hover{background:var(--surf2);color:var(--warn);}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border2);
  background:#fff;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.chip.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surf2);color:var(--sub);white-space:nowrap;}
.tag.red{background:color-mix(in srgb,var(--warn) 13%,#fff);color:#b8391f;}
.tag.amb{background:color-mix(in srgb,var(--amber) 15%,#fff);color:#8a5d00;}
.tag.grn{background:color-mix(in srgb,var(--green) 15%,#fff);color:#1d7a52;}
.tag.blu{background:#e6effc;color:var(--accent-deep);}

/* ── KPI tiles ── */
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;}
.tile{padding:12px 14px;}
.tile .k{font-size:11px;color:var(--sub);font-weight:600;}
.tile .v{font-size:26px;font-weight:800;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;}
.tile .v small{font-size:13px;font-weight:700;color:var(--sub);margin-left:2px;}
.tile .s{font-size:11px;color:var(--sub);margin-top:2px;}
.tile.wide{grid-column:span 2;}
.tile.alert .v{color:var(--warn);}
.tile.clk{cursor:pointer;} .tile.clk:hover{border-color:var(--accent);}

/* ── PDCA stacked bar & mini ── */
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surf2);gap:2px;}
.sbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:11px;font-weight:700;min-width:18px;}
.sbar.thin{height:8px;border-radius:4px;gap:1px;} .sbar.thin i{min-width:4px;font-size:0;}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--sub);margin-top:7px;}
.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
.pd{display:inline-flex;gap:2px;vertical-align:middle;}
.pd i{width:17px;height:17px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;
  color:#9aa6b8;background:#eef2f7;border:1px solid #e1e7ef;}
.pd i.done{color:#fff;border-color:transparent;}
.pd i.cur{background:#fff;border-width:2px;}
.pd.sm i{width:13px;height:13px;font-size:8px;border-radius:3px;}
.pd.sm i.cur{border-width:1.5px;}

/* ── Site cards ── */
.region{margin-top:6px;}
.region-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--accent-deep);margin:14px 2px 8px;}
.region-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent);}
.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.site{padding:14px 15px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.site-h{display:flex;align-items:center;gap:8px;}
.site-h .code{font-size:16px;font-weight:800;letter-spacing:.2px;}
.site-h .own{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.site-h .r{margin-left:auto;display:flex;gap:4px;align-items:center;}
.prog{display:flex;align-items:center;gap:10px;}
.prog .pct{font-size:22px;font-weight:800;min-width:58px;font-variant-numeric:tabular-nums;}
.prog .pct small{font-size:12px;color:var(--sub);}
.prog .bars{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
.pbar{height:6px;border-radius:3px;background:#e4eaf2;overflow:hidden;}
.pbar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3a7be0,#36b37e);}
.blk-t{font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.focus{font-size:12px;background:var(--surf2);border-radius:8px;padding:7px 9px;line-height:1.5;}
.focus .meta{font-size:10px;color:var(--sub);margin-top:2px;}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:7px;cursor:pointer;font-size:12px;}
.lrow:hover{background:var(--surf2);}
.lrow .nm{font-weight:700;white-space:nowrap;}
.lrow .st{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nx{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:12px;padding:3px 0;align-items:baseline;}
.nx .d{font-weight:700;font-variant-numeric:tabular-nums;font-size:11px;}
.nx .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nx .t span{color:var(--sub);}
.site-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding-top:8px;font-size:11px;color:var(--sub);}
.site-f .r{margin-left:auto;}
.empty{font-size:12px;color:var(--sub);padding:6px 0;}

/* ── Roadmap ── */
#roadmap{padding:10px 12px 6px;overflow:hidden;}
#roadmap svg{display:block;}
#roadmap .mk{cursor:pointer;}
#roadmap .mk:hover circle{stroke-width:3;}

/* ── Two-col lists ── */
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{font-size:11px;color:var(--sub);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr.clk{cursor:pointer;} .tbl tr.clk:hover td{background:rgba(47,111,208,.05);}
.feed{padding:4px 14px;}
.fe{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.fe:last-child{border-bottom:none;}
.fe .t{font-size:11px;color:var(--sub);}
.fe .w{font-size:11px;color:var(--sub);margin-top:1px;}

/* ── Matrix ── */
.mbar{padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.mbar .grp{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.mbar .sep{width:1px;height:22px;background:var(--border);margin:0 2px;}
.mbar label.ck{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;white-space:nowrap;}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--sub);padding:0 4px 8px;align-items:center;}
.mleg .s{display:inline-flex;align-items:center;gap:4px;}
.mwrap{overflow:auto;max-height:calc(100vh - 210px);border-radius:var(--rad);}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;background:#fff;min-width:100%;}
.mx th,.mx td{border-right:1px solid #edf1f6;border-bottom:1px solid #edf1f6;padding:5px 7px;white-space:nowrap;}
.mx thead th{position:sticky;background:#f5f8fc;z-index:3;font-weight:700;color:#3d4d66;font-size:11px;}
.mx thead tr.h1 th{top:0;height:28px;text-align:center;border-bottom:1px solid var(--border);}
.mx thead tr.h2 th{top:28px;vertical-align:bottom;}
.mx thead th.g-it{background:#eef4fd;} .mx thead th.g-te{background:#f2effc;} .mx thead th.g-pd{background:#effaf4;} .mx thead th.g-op{background:#fdf5e8;}
.mx th.vt{padding:6px 3px;width:30px;min-width:30px;max-width:30px;}
.mx th.vt div{writing-mode:vertical-rl;max-height:126px;margin:0 auto;line-height:1.15;font-weight:600;white-space:normal;}
.mx .stk{position:sticky;z-index:2;background:#fff;}
.mx thead .stk{z-index:4;background:#f5f8fc;}
.mx .c-pr{left:0;min-width:108px;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
.mx .c-ln{left:108px;min-width:120px;box-shadow:2px 0 0 #e3e9f1;}
.mx tbody tr.ln{cursor:pointer;}
.mx tbody tr.ln:hover td{background:#f6f9fe;}
.mx tbody tr.ln:hover td.stk{background:#f6f9fe;}
.mx tr.gp td{background:linear-gradient(90deg,#e8f0fc,#f4f7fb);font-weight:800;color:var(--accent-deep);padding:7px 10px;border-bottom:1px solid #d8e3f3;}
.mx tr.gp td .in-g{position:sticky;left:10px;display:inline-flex;gap:10px;align-items:center;}
.mx tr.gp td .in-g span{font-weight:600;color:var(--sub);font-size:11px;}
.mx td.s{text-align:center;font-size:13px;font-weight:700;padding:5px 2px;width:30px;}
.mx td.s.req{background:var(--req);}
.mx tbody tr.ln:hover td.s.req{background:#dfe9fb;}
.s-ok{color:var(--ok);} .s-dev{color:var(--dev);} .s-gap{color:var(--gap);} .s-na{color:#d5dce6;font-weight:400;}
table.mx.edit td.s{cursor:cell;}
table.mx.edit td.s:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.mx .ln-n{font-weight:700;}
.mx .ln-s{font-size:10px;color:var(--sub);}
.mx .sw{font-variant-numeric:tabular-nums;font-weight:600;}
.mx .wrap{white-space:normal;min-width:150px;max-width:220px;line-height:1.35;}
.mx .pct{font-size:11px;font-weight:700;color:var(--sub);margin-left:5px;font-variant-numeric:tabular-nums;}
.mx .dim{color:var(--sub);font-size:11px;}
.mx .kc{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:11px;line-height:1.35;}
.mx .kc .bad{color:var(--warn);}

/* ── Master data ── */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
.mcard{padding:12px 14px 14px;}
.mcard h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mcard h3 small{font-weight:500;color:var(--sub);font-size:11px;}
.mcard h3 .btn{margin-left:auto;}
.mt{width:100%;border-collapse:collapse;font-size:12px;}
.mt th{font-size:10px;color:var(--sub);text-align:left;font-weight:700;padding:4px 4px;}
.mt td{padding:3px 4px;vertical-align:middle;}
.mt td .in{width:100%;height:28px;}
.mt td.ac{white-space:nowrap;width:1%;}
.reqs{display:flex;flex-wrap:wrap;gap:3px;}
.reqs .chip{height:21px;font-size:10px;padding:0 7px;font-weight:600;}
.stg-h{font-size:11px;font-weight:800;margin:8px 0 2px;display:flex;align-items:center;gap:6px;}
.stg-h b{display:inline-block;width:18px;height:18px;border-radius:5px;color:#fff;text-align:center;line-height:18px;font-size:10px;}

/* ── Drawer ── */
#dw-ov{position:fixed;inset:0;background:rgba(20,32,56,.32);z-index:80;display:none;backdrop-filter:blur(1.5px);}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100vw);z-index:81;background:#f7f9fc;box-shadow:-8px 0 40px rgba(20,40,80,.25);
  display:none;flex-direction:column;}
#drawer.on,#dw-ov.on{display:flex;}
.dw-h{padding:14px 18px 12px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;}
.dw-h .t1{font-size:16px;font-weight:800;}
.dw-h .t2{font-size:11px;color:var(--sub);margin-top:2px;}
.dw-h .x{margin-left:auto;font-size:20px;}
.dw-b{flex:1;overflow-y:auto;padding:12px 16px 24px;}
.dw-f{padding:10px 16px;background:#fff;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;}
.dw-f .r{margin-left:auto;display:flex;gap:8px;}
.ds{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:10px;}
.ds h4{font-size:12px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.ds h4 small{font-weight:500;color:var(--sub);font-size:11px;}
.ds h4 .r{margin-left:auto;font-weight:600;}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr));}

// ═══════════════════════════════════════════
// 常數 & 預設主檔
// ═══════════════════════════════════════════
const APP_VER='4.3', APP_BETA=true, SCHEMA=5, STALE_DAYS=14, LOG_CAP=1500, SYNC_MS=5*60*1000, PUSH_IDLE=3000, PUSH_MAX=15000;   // 自動讀取：每 5 分鐘；自動上傳：停止編輯 3 秒後（連續編輯時最多 15 秒也會先送一次），期間的修改合併成一次

const IST={ok:{t:'已具備',sym:'●'},off:{t:'可開啟',sym:'○'},dev:{t:'開發中',sym:'◐'},gap:{t:'缺口',sym:'✕'},unk:{t:'未設定對應技術',sym:'?'},na:{t:'不需',sym:'·'}};
const PST=[{k:'',t:'不支援'},{k:'plan',t:'規劃中'},{k:'dev',t:'開發中'},{k:'ok',t:'已釋出'}];   // 技術能力在各版本的開發進度
const PSYM={ok:'●',dev:'◐',plan:'○','':'—'};
/** 光學調整確認項目（每條線逐項確認；lines.optic={key:'YYYY-MM-DD'（完成日）|'na'（不適用）}，沒有值＝未確認） */
const OPTICS=[{k:'pitch',t:'最佳 Pitch & WD',ph:'例：Pitch 3.2 / WD 350 mm'},{k:'abt',t:'αβθ 調整',ph:'例：α 0.02° / β 0.01° / θ 0.03°'},
  {k:'focus',t:'對焦分數',ph:'例：中心 88 / 四角 ≥ 82'},{k:'side',t:'側光效果',ph:'例：側光 45°，刮傷 / 異物清楚可見'}];
/** 光學調整狀態（v3.1）：optic[k]={d:完成日, v:參考值}，兩個都有才算完成 ok；選了完成但沒填齊＝pend（含 v3.0 只有日期的舊資料）；'na'＝不適用；沒有值＝未確認 */
const opSt=(l,k)=>{ const v=((l&&l.optic)||{})[k]; if(!v) return ''; if(v==='na') return 'na'; if(typeof v==='object') return v.d&&String(v.v||'').trim()?'ok':'pend'; return 'pend'; };
const opVal=(l,k)=>{ const v=((l&&l.optic)||{})[k]; return typeof v==='object'&&v?v:typeof v==='string'&&v!=='na'?{d:v,v:''}:{}; };
/** 光學調整進度：不適用的不算；回傳 {done, total} */
const opProg=l=>{ const ks=OPTICS.filter(o=>opSt(l,o.k)!=='na'); return {done:ks.filter(o=>opSt(l,o.k)==='ok').length,total:ks.length}; };   // 狀態統一用符號表示：● 已釋出 / 可檢、◐ 開發中、○ 規劃中、— 不支援
const LTS=[{k:'on',t:'已開啟'},{k:'off',t:'未開啟'}];                                       // 產線上的技術能力（版本已釋出的預設開啟）
const SHAPES=[{k:'rect',t:'矩形'},{k:'free',t:'異形'}];
const PSHAPES=[{k:'rect',t:'矩形'},{k:'free',t:'異形'},{k:'both',t:'矩形 + 異形'}];
const MS_DEF=[{k:'install',name:'機台進廠'},{k:'sat',name:'驗收 SAT'},{k:'golive',name:'量產上線'}];
const KPI_DEF=[

const DEF_SITES=[
  {id:'XM-S11',name:'S11',region:'廈門 XM',order:1},{id:'XM-S17',name:'S17',region:'廈門 XM',order:2},{id:'XM-S19',name:'S19',region:'廈門 XM',order:3},
  {id:'SZ-S01',name:'S01',region:'蘇州 SZ',order:4},{id:'SZ-S02',name:'S02',region:'蘇州 SZ',order:5},{id:'SZ-S06',name:'S06',region:'蘇州 SZ',order:6}];
const DEF_ITEMS=[['點缺陷（亮/暗點）','點線'],['線缺陷（亮/暗線）','點線'],['區域 Mura','Mura'],['線狀 / 帶狀 Mura','Mura'],
  ['漏光 / 邊角 Mura','Mura'],['異物 Particle','外觀'],['刮傷 / 破片','外觀'],['亮度均勻性','光學量測'],['色度 / 色偏','光學量測'],
  ['Gamma / 灰階','光學量測'],['Flicker 閃爍','光學量測'],['Crosstalk 串擾','光學量測']];
const DEF_HWS=['29MP','31MP','61MP','71MP','151MP','AIL61-80','AIC61-80','AIC61-50','AIL151-55'];   // 畫檢設備上用的相機
const DEF_TECHS=[['高解析取像 / Moiré 抑制',''],['Mura 量化（SEMU / JND）',''],['AI 缺陷分類（ADC）',''],['深度學習缺陷偵測',''],
  ['成像式色度量測',''],['Demura 補償資料輸出',''],['異形 / 曲面面板對位',''],['自動 Recipe 生成',''],['MES / 良率系統串接',''],
  ['點線缺陷檢測',''],['Mura 檢測',''],['色偏 / 色斑檢測','']];
// v2.3：技術能力分類。前處理（取像後、演算法前）→ 演算法（量測 / 檢測）→ 判定 / 整合（演算法之後）
const TCATS=[{k:'pre',t:'前處理',g:'前處理'},{k:'meas',t:'量測',g:'演算法'},{k:'det',t:'檢測',g:'演算法'},{k:'post',t:'判定 / 整合',g:'判定 / 整合'}];
const TCAT_IDX={pre:0,meas:1,det:2,post:3};
const DEF_TECH_CAT={t01:'pre',t07:'pre',t02:'meas',t05:'meas',t04:'det',t10:'det',t11:'det',t12:'det',t03:'post',t06:'post',t08:'post',t09:'post'};
// 型態需要的前處理（佔位值）：異形、曲面異形 → 異形 / 曲面面板對位
const DEF_FORM_PRE={f02:['t07'],f03:['t07']};
const DEF_PLATS=[['畫檢1.0-Win7 矩形版','rect'],['畫檢1.0-Win7 異形版','free'],['畫檢1.0-Win10 矩形版','rect'],['畫檢1.0-Win10 異形版','free'],['畫檢2.0','both']];
// 以下兩組是「佔位用」的預設樹狀關係，請在主檔設定依實際狀況校正
// 技術能力在各軟體版本（v01～v05 依上面順序）的開發進度：ok 已釋出 / dev 開發中 / plan 規劃中 / 未列 = 不支援
const DEF_TECH_PLAT={
  t01:{v01:'ok',v02:'ok',v03:'ok',v04:'ok',v05:'ok'}, t02:{v01:'ok',v02:'ok',v03:'ok',v04:'ok',v05:'ok'},
  t03:{v03:'ok',v04:'dev',v05:'ok'}, t04:{v03:'dev',v04:'plan',v05:'ok'}, t05:{v03:'ok',v04:'ok',v05:'ok'},
  t06:{v05:'dev'}, t07:{v02:'ok',v04:'ok',v05:'ok'}, t08:{v05:'dev'}, t09:{v03:'ok',v04:'ok',v05:'ok'},
  t10:{v01:'ok',v02:'ok',v03:'ok',v04:'ok',v05:'ok'}, t11:{v01:'ok',v02:'ok',v03:'ok',v04:'ok',v05:'ok'}, t12:{v03:'ok',v04:'ok',v05:'ok'}};
// 檢測項目需要的演算法（全部具備才算能檢）：預設值；之後由使用者在主檔「✎ 選擇」視窗勾選（可選任何技術能力）
const DEF_ITEM_TECH={i01:['t10'],i02:['t10'],i03:['t11'],i04:['t11'],i05:['t11'],i06:['t04'],i07:['t04'],i08:['t05'],i09:['t05'],i10:['t05'],i11:['t05'],i12:['t05']};
// v2.1：PDCA 精簡為 8 個關卡；key 標記里程碑（進廠 / SAT / 上線）。id 沿用舊版，讓已勾選的完成日可以保留
const DEF_STEPS=[['s01','P','需求確認',''],['s03','P','設備採購',''],['s05','D','機台進廠','install'],['s08','D','Recipe 調校完成',''],
  ['s09','C','Correlation 達標',''],['s11','C','SAT 驗收','sat'],['s12','A','量產上線','golive'],['s13','A','KPI 穩定','']];
// 產品設定：產品別 → 型態 → 檢測項目（fr = {型態id: [檢測項目id…]}）。檢測項目為佔位值，請在主檔設定校正
const DEF_PRODS=[
  ['pc-nb','NB',{f01:['i01','i02','i03','i04','i05','i06','i07'],f04:['i01','i02','i03','i04','i05','i06','i07']}],
  ['pc-dt','DT',{f01:['i01','i02','i03','i04','i05','i06','i07']}],
  ['pc-tv','TV',{f01:['i01','i02','i03','i04','i05','i08','i09']}],
  ['pc-fidm','FIDM',{f01:['i01','i02','i03','i04','i05','i08','i09'],f03:['i01','i02','i03','i04','i05','i08','i09','i10']}]];
const DEF_FORMS=['矩形','異形','曲面異形','二合一','三合一','防窺屏'];
const ALL_FORMS=['f01','f02','f03','f04','f05','f06'];
const shapeForms=s=>s==='rect'?['f01']:s==='free'?['f02']:ALL_FORMS.slice();

// ═══════════════════════════════════════════
// 工具
// ═══════════════════════════════════════════
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
function stable(o){
  if(o===undefined) return 'u';
  if(o===null||typeof o!=='object') return JSON.stringify(o);
  if(Array.isArray(o)) return '['+o.map(stable).join(',')+']';
  return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
}
const eq=(a,b)=>stable(a)===stable(b);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
function parseD(s){ if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const [y,m,d]=s.slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysFromToday(s){ const d=parseD(s); if(!d) return null; return Math.round((d-parseD(todayStr()))/864e5); }
function daysSince(iso){ if(!iso) return Infinity; return (Date.now()-new Date(iso).getTime())/864e5; }
const md=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';
function relTime(iso){
  if(!iso) return '—'; const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return '剛剛'; if(s<3600) return Math.floor(s/60)+' 分鐘前'; if(s<86400) return Math.floor(s/3600)+' 小時前';
  if(s<86400*30) return Math.floor(s/86400)+' 天前'; return new Date(iso).toLocaleDateString('zh-TW');
}
function dueTag(s){
  const d=daysFromToday(s); if(d===null) return '';
  if(d<0) return `<span class="tag red">逾期 ${-d} 天</span>`;
  if(d===0) return `<span class="tag amb">今天</span>`;
  if(d<=7) return `<span class="tag amb">${d} 天後</span>`;
  return `<span class="tag">${d} 天後</span>`;
}
function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('⚠ 本機儲存失敗：'+e.message,'err'); } }
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(b){ return decodeURIComponent(escape(atob((b||'').replace(/\n/g,'')))); }
function toast(msg,type,ms){
  const d=document.createElement('div'); d.className='tst '+(type||''); d.textContent=msg; $('#toast').appendChild(d);
  setTimeout(()=>d.remove(), ms||(type==='err'?6000:2800));
}

// ═══════════════════════════════════════════
// 資料層（本機 localStorage + 變更追蹤）
// ═══════════════════════════════════════════
let DB=null, DIRTY=null;
let USER=loadJSON(LS.user)||{name:'',site:''};
let UI=Object.assign({page:'overview',mf:{sites:[],product:'',form:'',stage:'',plat:'',hw:'',q:'',gapOnly:false,allItems:false,edit:false}},loadJSON(LS.ui)||{});

function emptyDB(){ return {meta:{app:'aoi-monitor',schema:SCHEMA,updated:''},sites:[],products:[],forms:[],plats:[],techs:[],items:[],hws:[],steps:[],lines:[],log:[]}; }
function defaultDB(){
  const db=emptyDB();
  db.sites=DEF_SITES.map(s=>({...s,owner:'',focus:''}));
  db.products=DEF_PRODS.map((x,i)=>({id:x[0],name:x[1],fr:clone(x[2]),order:i+1}));
  db.forms=DEF_FORMS.map((x,i)=>({id:'f'+pad(i+1),name:x,pre:(DEF_FORM_PRE['f'+pad(i+1)]||[]).slice(),order:i+1}));
  db.plats=DEF_PLATS.map((x,i)=>({id:'v'+pad(i+1),name:x[0],forms:shapeForms(x[1]),note:'',order:i+1}));
  db.items=DEF_ITEMS.map((x,i)=>({id:'i'+pad(i+1),name:x[0],cat:x[1],techs:(DEF_ITEM_TECH['i'+pad(i+1)]||[]).slice(),order:i+1}));
  db.techs=DEF_TECHS.map((x,i)=>({id:'t'+pad(i+1),name:x[0],note:x[1],cat:DEF_TECH_CAT['t'+pad(i+1)]||'det',plat:clone(DEF_TECH_PLAT['t'+pad(i+1)]||{}),order:i+1}));
  db.hws=DEF_HWS.map((x,i)=>({id:'h'+pad(i+1),name:x,order:i+1}));
  db.steps=DEF_STEPS.map((x,i)=>({id:x[0],stage:x[1],name:x[2],key:x[3]||undefined,order:i%2+1}));
  return db;
}
function emptyDirty(){ const d={}; COLLS.forEach(c=>d[c]={}); return d; }
function loadLocal(){
  DB=loadJSON(LS.db); DIRTY=loadJSON(LS.dirty);
  if(!DB||!DB.meta){ DB=defaultDB(); Object.assign(DB,mergeDemo(DB)); }
  COLLS.concat('log').forEach(c=>{ if(!Array.isArray(DB[c])) DB[c]=[]; });
  if(!DIRTY) DIRTY=emptyDirty(); COLLS.forEach(c=>{ if(!isObj(DIRTY[c])) DIRTY[c]={}; });
  // v1.3 新增「硬體」主檔：舊資料沒有時補上預設清單，並標記待上傳讓雲端也有
  if(!DB.hws.length&&!DB.meta.hwsSeeded){ DB.hws=DEF_HWS.map((x,i)=>({id:'h'+pad(i+1),name:x,order:i+1})); DB.hws.forEach(h=>DIRTY.hws[h.id]=null); DB.meta.hwsSeeded=true; }
  // v2.0：未連線時直接補齊新欄位；連線時等讀到雲端之後再補（見 pullNow / pushNow）
  if(!ghReady()) migrateV2();
}
function saveLocal(){ saveJSON(LS.db,DB); saveJSON(LS.dirty,DIRTY); }
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const live=c=>DB[c].filter(x=>!x.deleted);
const byId=(c,id)=>DB[c].find(x=>x.id===id);
function liveSorted(c){ return live(c).sort((a,b)=>(a.order??999)-(b.order??999)||String(a.name||a.id).localeCompare(String(b.name||b.id),'zh-Hant')); }
function nextOrder(c){ return Math.max(0,...live(c).map(x=>x.order||0))+1; }
function dirtyCount(){ return COLLS.reduce((n,c)=>n+Object.keys(DIRTY[c]).length,0); }
const hasDemo=()=>DB.lines.some(l=>l.demo&&!l.deleted)||DB.products.some(p=>p.demo&&!p.deleted);

/** 提交一筆實體的新版本：記錄修改前的版本（3-way merge 的 base）、標記待上傳 */
function commit(c,obj,msg){
  const arr=DB[c], i=arr.findIndex(x=>x.id===obj.id), prev=i>=0?arr[i]:undefined;
  if(!has(DIRTY[c],obj.id)) DIRTY[c][obj.id]=prev?clone(prev):null;
  obj.updatedAt=new Date().toISOString(); obj.updatedBy=USER.name||'未具名';
  if(i>=0) arr[i]=obj; else arr.push(obj);
  if(msg) addLog(msg,{ref:obj.id,coll:c,site:c==='sites'?obj.id:(obj.site||''),demo:obj.demo||undefined});
  saveLocal(); schedulePush(); renderAll();
}
/** 安靜存檔：只同步資料，不改 updatedAt / updatedBy、不寫變更紀錄（用在個人的特別關注，避免誤觸「待更新」提醒與最新動態） */
function commitQuiet(c,obj){
  const arr=DB[c], i=arr.findIndex(x=>x.id===obj.id), prev=i>=0?arr[i]:undefined;
  if(!has(DIRTY[c],obj.id)) DIRTY[c][obj.id]=prev?clone(prev):null;
  if(i>=0) arr[i]=obj; else arr.push(obj);

function kpiBad(l,k,v){ if(v===undefined||v===''||v===null) return false; const d=KPI_DEF.find(x=>x.k===k), t=kpiTarget(l,k); return d.better==='low'?+v>t:+v<t; }
function sortLines(ls){
  const so=id=>(byId('sites',id)||{}).order??999;
  return ls.sort((a,b)=>so(a.site)-so(b.site)||prodName(a.product).localeCompare(prodName(b.product),'zh-Hant')||String(a.line).localeCompare(String(b.line),'zh-Hant',{numeric:true}));
}
function siteStats(sid){
  const ls=sortLines(liveLines().filter(l=>l.site===sid)); const cnt={P:0,D:0,C:0,A:0};
  let pct=0,gaps=0,blocked=0,overdue=0,stale=0,last='',lastBy='';
  for(const l of ls){ const p=lineProg(l); cnt[p.stage]++; pct+=p.pct; gaps+=lineGaps(l); if(l.blocked) blocked++; if(isOverdue(l)) overdue++; if(isStale(l)) stale++;
    if((l.updatedAt||'')>last){ last=l.updatedAt; lastBy=l.updatedBy; } }
  const s=byId('sites',sid); if(s&&(s.updatedAt||'')>last){ last=s.updatedAt; lastBy=s.updatedBy; }
  return {ls,cnt,pct:ls.length?Math.round(pct/ls.length):0,gaps,blocked,overdue,stale,last,lastBy};
}
function upcoming(ls,days){
  const out=[];
  for(const l of ls){ const done=l.done||{}, plan=l.plan||{}, p=lineProg(l), st=lineSteps(l);
    for(const s of st){ if(done[s.id]||!plan[s.id]) continue; const d=daysFromToday(plan[s.id]); if(d>days) continue;
      const isCur=!!(p.cur&&p.cur.id===s.id);
      out.push({d,date:plan[s.id],l,what:isCur&&l.nextNote?l.nextNote:(s.key?'里程碑：':'')+s.name,who:lineOwner(l),kind:isCur?'act':'ms'}); } }
  return out.sort((a,b)=>a.d-b.d);
}
function pdMini(l,sm){
  const p=lineProg(l), ci=p.complete?4:STG_IDX[p.stage];
  return `<span class="pd${sm?' sm':''}" title="${p.complete?'全部完成':'目前：'+p.stage+' '+STAGES[ci].name+'｜'+esc(p.cur?p.cur.name:'')}（${p.pct}%）">`+
    STAGES.map((s,i)=>i<ci?`<i class="done" style="background:var(--s${s.k})">${s.k}</i>`:i===ci?`<i class="cur" style="border-color:var(--s${s.k});color:var(--s${s.k})">${s.k}</i>`:`<i>${s.k}</i>`).join('')+'</span>';
}
function pdcaBar(cnt,thin){
  const tot=STAGES.reduce((n,s)=>n+cnt[s.k],0);
  if(!tot) return `<div class="sbar${thin?' thin':''}"></div>`;
  return `<div class="sbar${thin?' thin':''}">`+STAGES.filter(s=>cnt[s.k]).map(s=>`<i style="flex:${cnt[s.k]};background:var(--s${s.k})" title="${s.k} ${s.name}：${cnt[s.k]} 條">${cnt[s.k]}</i>`).join('')+'</div>';
}
const stageLegend=()=>`<div class="leg">${STAGES.map(s=>`<span><b style="background:var(--s${s.k})"></b>${s.k} ${s.name}</span>`).join('')}<span class="muted">｜P→C 上線前・A 上線後</span></div>`;

/** 總覽「逾期」→ 展開並捲到「接下來 30 天 & 逾期」 */
function ovGoUp(){ UI.ov=UI.ov||{}; if(UI.ov.two){ UI.ov.two=false; saveUI(); const t=$('#pg-overview .ov-two'); if(t) t.classList.remove('tw-off'); ovFit(); } const u=$('#ov-up'); if(u) u.scrollIntoView({behavior:'smooth',block:'center'}); }
/** 總覽地區區塊的收合與廠區卡顯示模式（只存本機）：mode＝full 完整 / key 重點 / min 收合 */
const OV_MODE={full:'▤ 卡片：完整',key:'▥ 卡片：重點',min:'▭ 卡片：收合'}, OV_NEXT={full:'key',key:'min',min:'full'};
function ovRg(k){ const r=((UI.ov||{}).rg||{})[k]||{}; return {off:!!r.off,mode:OV_MODE[r.mode]?r.mode:'full'}; }
function ovSave(k,st){ UI.ov=UI.ov||{}; UI.ov.rg=UI.ov.rg||{}; UI.ov.rg[k]=st; saveUI(); }
/** 最新動態只顯示 7 筆高度（其餘捲動），「接下來 30 天」卡片同高、左右對齊 */
function ovFit(){
  const fd=$('#ov-feed'), up=$('#ov-up'); if(!fd||!up||!fd.offsetWidth) return;
  fd.style.maxHeight=up.style.maxHeight='';
  const fs=$$('.fe',fd); if(!fs.length) return;
  fd.scrollTop=0; const n=Math.min(7,fs.length), h=fs[n-1].getBoundingClientRect().bottom-fd.getBoundingClientRect().top+(fs.length>7?2:6);
  fd.style.maxHeight=up.style.maxHeight=Math.max(h,160)+'px';
}
/** 總覽視角（v3.15，只存本機）：site 依廠區（預設）/ seg 依段別；依段別時可篩選 廠區（或整個地區）、產品別、樓層 / 區域，一次展開一個段別的明細 */
const ovView=()=>(UI.ov||{}).view==='site'?'site':'seg';   // 預設依段別（v4.1.1）
/** 依段別的「比較組」（Johnny：可以自己新增，同時看不同廠區的多個段別）：每組各自的篩選 sf 與展開狀態 open / all，只存本機。
 *  舊版只有一組（UI.ov.sf / segOpen / segAll），第一次讀到時轉成第一組 */
const OV_BMAX=4;
function ovBlocks(){
  const o=UI.ov=UI.ov||{};
  if(!Array.isArray(o.blocks)||!o.blocks.length){
    const op=Array.isArray(o.segOpen)?o.segOpen:typeof o.segOpen==='string'?[o.segOpen]:[];
    o.blocks=[{sf:o.sf||{},open:op,all:o.segAll||[]}]; delete o.sf; delete o.segOpen; delete o.segAll;
  }
  return o.blocks.map(b=>({sf:Object.assign({site:'',fam:'',floor:''},b.sf||{}),open:Array.isArray(b.open)?b.open:[],all:Array.isArray(b.all)?b.all:[],fc:Array.isArray(b.fc)?b.fc:[],sub:b.sub||''}));
}
function ovSet(o){ UI.ov=UI.ov||{}; Object.assign(UI.ov,o); saveUI(); renderOverview(); }
function ovBSet(i,fn){ const bs=ovBlocks(); if(!bs[i]) return; fn(bs[i]); ovSet({blocks:bs}); }
function ovSetF(i,k,v){ ovBSet(+i,b=>{ b.sf[k]=v; if(k!=='floor') b.sf.floor=''; }); }
function ovBAdd(){ const bs=ovBlocks(); if(bs.length>=OV_BMAX) return; bs.push({sf:{},open:[],all:[]}); ovSet({blocks:bs}); }
function ovBDel(i){ const bs=ovBlocks(); if(bs.length<2) return; bs.splice(+i,1); ovSet({blocks:bs}); }
const prodFams=()=>[...new Set(liveSorted('products').map(p=>(p.name||'').trim()).filter(Boolean))];
function ovMatch(l,f,skipFloor){
  if(f.site){ if(f.site.startsWith('rg:')){ if(((byId('sites',l.site)||{}).region||'其他')!==f.site.slice(3)) return false; } else if(l.site!==f.site) return false; }
  if(f.fam&&!lineProds(l).some(p=>((byId('products',p)||{}).name||'').trim()===f.fam)) return false;
  if(!skipFloor&&f.floor&&(lineFloor(l)||'-')!==f.floor) return false;
  return true;
}
function ovViewBar(L,regions){
  const v=ovView(), sw=`<span class="seg vw">${[['seg','依段別','每個段別一張卡片，可依廠區、產品別、樓層 / 區域篩選'],['site','依廠區','每個廠區一張卡片']].map(([k,t,tt])=>`<button class="${v===k?'on':''}" title="${tt}" onclick="ovSet({view:'${k}'})">${t}</button>`).join('')}</span>`;
  if(v!=='seg') return `<div class="ov-vw">${sw}</div>`;
  const n=ovBlocks().length;
  return `<div class="ov-vw">${sw}<span class="ovf-n">共 <b>${L.length}</b> 台</span>${n<OV_BMAX?`<button class="btn sm" onclick="ovBAdd()" title="多一組篩選＋段別卡片，可以同時看不同廠區 / 產品別的段別（最多 ${OV_BMAX} 組，只存在這台電腦）">＋ 新增比較組</button>`:''}</div>`;
}
/** 一個比較組的篩選列：廠區（可選整個地區）、產品別、樓層 / 區域 */
function ovBlockBar(L,regions,b,i,n){
  const f=b.sf, fl=[...new Set(L.filter(l=>ovMatch(l,f,true)).map(l=>lineFloor(l)||'-'))].sort((a,b)=>a==='-'?1:b==='-'?-1:a.localeCompare(b,'zh-Hant',{numeric:true}));
  const sel=(k,lb,opts)=>`<label class="ovf"><span>${lb}</span><select class="in ${f[k]?'act':''}" onchange="ovSetF(${i},'${k}',this.value)"><option value="">全部</option>${opts}</select></label>`;
  const siteO=regions.map(r=>`<optgroup label="${esc(r.name)}"><option value="rg:${esc(r.name)}" ${f.site==='rg:'+r.name?'selected':''}>整個${esc(r.name)}</option>${r.sites.map(s=>`<option value="${esc(s.id)}" ${f.site===s.id?'selected':''}>${esc(s.id)}</option>`).join('')}</optgroup>`).join('');
  const famO=prodFams().map(x=>`<option value="${esc(x)}" ${f.fam===x?'selected':''}>${esc(x)}</option>`).join('');
  const flO=fl.map(x=>`<option value="${esc(x)}" ${f.floor===x?'selected':''}>${x==='-'?'（未填）':esc(x)}</option>`).join('');
  const m=L.filter(l=>ovMatch(l,f)).length, any=f.site||f.fam||f.floor;
  return `<div class="ovb-h">${n>1?`<span class="ovb-no">${i+1}</span>`:''}${sel('site','廠區',siteO)}${sel('fam','產品別',famO)}${sel('floor','樓層 / 區域',flO)}
    <span class="ovf-n">${any?`篩選後 <b>${m}</b> 台`:`全部 <b>${m}</b> 台`}</span>${any?`<button class="btn sm" onclick="ovBSet(${i},b=>{b.sf={}})">清除篩選</button>`:''}${n>1?`<button class="ovb-x" onclick="ovBDel(${i})" title="移除這組">✕</button>`:''}</div>`;
}
/** 展開 / 收合段別（每個比較組各自，可同時展開多個）；all＝這個段別顯示全部機台（預設先顯示 SEG_KMAX 台）。el＝被點的元素，往上找 data-b 比較組 */
const tgl=(a,k)=>a.includes(k)?a.filter(x=>x!==k):[...a,k];
function ovSegTg(el){ ovBSet(+el.closest('[data-b]').dataset.b,b=>{ b.open=b.open.includes(el.dataset.seg)?[]:[el.dataset.seg]; b.sub=''; }); }   // 一組一次只展開一個段別
function ovSegAll(el){ ovBSet(+el.closest('[data-b]').dataset.b,b=>{ b.all=tgl(b.all,el.dataset.k); }); }
function ovSegSub(el){ ovBSet(+el.closest('[data-b]').dataset.b,b=>{ b.sub=el.dataset.s; }); }
function ovSegFc(el){ ovBSet(+el.closest('[data-b]').dataset.b,b=>{ b.fc=tgl(b.fc,el.dataset.k); }); }
/** 展開面板上緣的小三角對準被展開的段別卡片 */
function segPtr(){ document.querySelectorAll('.sgp').forEach(p=>{ const c=p.parentElement.querySelector('.sgc.on'); if(!c) return; const r=c.getBoundingClientRect(); p.style.setProperty('--ax',(r.left-p.getBoundingClientRect().left+r.width/2)+'px'); }); }
const SEG_KMAX=10;
/** 段別卡片的統計：台數、綠 / 黃燈、已量產 / 導入中、缺口 / 卡關 / 逾期 */
function segStats(ls){
  const s={n:ls.length,g:0,y:0,mass:0,gap:0,blocked:0,overdue:0};
  for(const l of ls){ s[lineLight(l)]++; if(isMass(l)) s.mass++; if(lineGaps(l)) s.gap++; if(l.blocked) s.blocked++; if(isOverdue(l)) s.overdue++; }
  s.intro=s.n-s.mass; return s;
}
function segSection(L,regions){
  const bs=ovBlocks();
  if(!L.length) return '<div class="card empty" style="padding:16px">尚無產線</div>';
  const hint=!segList().length?`<div class="banner"><span>📦 主檔「產品設定」還沒有填<b>段別</b>：到 主檔設定 → 產品設定，在每個產品別旁選段別（${SEG_HINT.join(' / ')}），這裡就會依段別分卡片。</span><button class="btn sm" onclick="showPage('master')">前往主檔設定</button></div>`:'';
  // 各組共用同一排欄位（上下對齊）：CT / PBI / FD 一定有；SKD、BIM、Set、EOL 與主檔以外的段別，任何一組有機台才加；有沒分段的機台時最後多一欄「未分段」
  const has=new Set(); let none=false;
  for(const b of bs) for(const l of L) if(ovMatch(l,b.sf)){ const m=segMain(lineSeg(l)); if(m) has.add(m); else none=true; }
  const mains=[...SEG_MAIN.filter(m=>!m.opt||has.has(m.k)).map(m=>m.k),...[...has].filter(k=>!SEG_MAIN.some(m=>m.k===k)).sort()];
  return hint+bs.map((b,i)=>`<div class="ovb ${bs.length>1?'multi':''}" data-b="${i}">${ovBlockBar(L,regions,b,i,bs.length)}${segBlock(L,b,mains,mains.length+(none?1:0))}</div>`).join('');
}
/** 一個比較組的段別卡片（v4.3）：主段別一張卡，CT / PBI / FD 卡片裡再列 1、2 的小計；這組沒有機台的段別淡色、不能展開；展開的段別在那一排下方出現整排寬的面板 */
function segBlock(L,b,mains,cols){
  const f=b.sf, ls=L.filter(l=>ovMatch(l,f));
  const groups=mains.map(k=>{ const d=SEG_MAIN.find(m=>m.k===k)||{}, gl=ls.filter(l=>segMain(lineSeg(l))===k);
    const subs=d.sub?[...new Set([...d.sub,...gl.map(lineSeg)])].sort((a,b)=>segRank(a)-segRank(b)||a.localeCompare(b)):[];   // 只填「CT」沒分 1 / 2 的也列一行「未分」
    return {k,ls:gl,subs}; });
  const none=ls.filter(l=>!segMain(lineSeg(l))); if(cols>mains.length) groups.push({k:'',ls:none,subs:[]});
  const op=groups.find(g=>g.ls.length&&b.open.includes(g.k));
  const cards=groups.map(g=>{ const s=segStats(g.ls), nm=g.k||'未分段', on=g===op;
    const say=[s.gap?`${s.gap} 台有缺口`:'',s.blocked?`${s.blocked} 台卡關`:'',s.overdue?`${s.overdue} 台逾期`:''].filter(Boolean);
    const sub=g.subs.length?`<div class="sg-sub">${g.subs.map(x=>{ const t=segStats(g.ls.filter(l=>lineSeg(l)===x));

/** 展開面板：可切換子段別（全部 / CT1 / CT2）；依子段別 → 廠區 → 樓層 / 區域分組（可收合），組內有問題的排前面（卡關 / 逾期 / 缺口 → 黃燈 → 綠燈），每組先顯示 SEG_KMAX 台 */
function segPanel(g,b){

    </div>`; };
  const body=sub.map(t=>{ const k=g.k+'|'+t.key, off=grp&&b.fc.includes(k), all=b.all.includes(k), s=segStats(t.ls), [sg,st,fl]=t.key.split('|');
    const kl=t.ls.slice().sort((a,b)=>pr(a)-pr(b)||String(a.line).localeCompare(String(b.line),'zh-Hant',{numeric:true})), show=all?kl:kl.slice(0,SEG_KMAX);

function drawRoadmap(){
  const box=$('#roadmap'); if(!box||!box.offsetWidth) return;
  const sites=liveSorted('sites'), W=box.clientWidth-24, LW=78, RH=38, TOP=36, H=TOP+sites.length*RH+6;
  // 顯示範圍：依實際上線日期自動調整（最多往前 12 個月、往後 18 個月），至少涵蓋 今天-2 ~ 今天+6 個月
  const t0=parseD(todayStr()), mk=(n)=>new Date(t0.getFullYear(),t0.getMonth()+n,1);
  const allD=liveLines().map(l=>{ const g=golive(l); return g?parseD(g.d):null; }).filter(Boolean);
  const dMin=allD.length?new Date(Math.min(...allD)):t0, dMax=allD.length?new Date(Math.max(...allD)):t0;
  const start=new Date(Math.max(mk(-12),Math.min(mk(-2),new Date(dMin.getFullYear(),dMin.getMonth(),1))));
  const end=new Date(Math.min(mk(19),Math.max(mk(7),new Date(dMax.getFullYear(),dMax.getMonth()+2,1))));
  const X=d=>LW+(d-start)/(end-start)*(W-LW-8);
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="inherit">`;
  const months=(end.getFullYear()-start.getFullYear())*12+end.getMonth()-start.getMonth(), mw=(W-LW-8)/months, step=mw<22?3:mw<40?2:1;
  for(let m=new Date(start),i=0;m<=end;m=new Date(m.getFullYear(),m.getMonth()+1,1),i++){
    const x=X(m); svg+=`<line x1="${x}" y1="${TOP-6}" x2="${x}" y2="${H-4}" stroke="${m.getMonth()===0?'#cfd8e6':'#e6ebf2'}"/>`;
    if(m<end&&i%step===0) svg+=`<text x="${x+4}" y="${TOP-11}" font-size="10" fill="#6b7a90">${m.getMonth()+1}月</text>`;
    if(m<end&&(m.getMonth()===0||i===0)) svg+=`<text x="${x+4}" y="10" font-size="10" font-weight="700" fill="#1f4e96">${m.getFullYear()}</text>`;
  }
  sites.forEach((s,i)=>{ const y=TOP+i*RH; svg+=`<rect x="0" y="${y}" width="${W}" height="${RH}" fill="${i%2?'transparent':'rgba(47,111,208,.035)'}"/><text x="4" y="${y+RH/2+4}" font-size="12" font-weight="800" fill="#1c2b45">${esc(s.id)}</text>`; });
  const tx=X(t0); svg+=`<line x1="${tx}" y1="${TOP-6}" x2="${tx}" y2="${H-4}" stroke="#e0563f" stroke-dasharray="3 3"/><text x="${tx+3}" y="${H-6}" font-size="9" fill="#e0563f">今天</text>`;
  let beyond=0;
  sites.forEach((s,i)=>{
    const ls=liveLines().filter(l=>l.site===s.id).map(l=>{ const g=golive(l); return g?{l,d:g.d,act:g.act}:null; }).filter(Boolean).sort((a,b)=>a.d<b.d?-1:1);
    const lanes=[-Infinity,-Infinity,-Infinity];
    for(const m of ls){
      const dt=parseD(m.d); if(dt<start||dt>end){ beyond++; continue; }
      const x=X(dt); let ln=lanes.findIndex(v=>x-v>13); if(ln<0) ln=1; lanes[ln]=x;
      const y=TOP+i*RH+RH/2+(ln-1)*10, late=!m.act&&daysFromToday(m.d)<0;
      const col=m.act?'#36b37e':late?'#e0563f':'#2f6fd0';
      svg+=`<g class="mk" onclick="openLine('${m.l.id}')"><title>${esc(s.id)} · ${esc(lineLabel(m.l))}\n量產上線 ${m.act?'實際':'計畫'}：${m.d}${late?'（已過計畫日）':''}</title><circle cx="${x}" cy="${y}" r="5.5" fill="${m.act?col:'#fff'}" stroke="${col}" stroke-width="2"/></g>`;
    }
  });
  svg+='</svg>';
  box.innerHTML=svg+(beyond?`<div class="muted" style="font-size:11px;padding:2px 0 4px">另有 ${beyond} 條產線的上線日期在顯示範圍外</div>`:'');
}

function sparkHtml(w){
  const k=w.kpi||{}, ds=Object.keys(k).sort();
  return `<div class="spark">${KPI_DEF.map(d=>{
    const pts=ds.map(x=>k[x][d.k]).map(v=>v===undefined||v===''?null:+v);
    const vals=pts.filter(v=>v!==null); if(vals.length<1) return '';
    const t=kpiTarget(w,d.k), lo=Math.min(...vals,t), hi=Math.max(...vals,t), Wd=160, Hd=34, rng=(hi-lo)||1;
    const X=i=>ds.length<2?Wd/2:4+i*(Wd-8)/(ds.length-1), Y=v=>Hd-4-(v-lo)/rng*(Hd-8);
    const path=pts.map((v,i)=>v===null?'':`${X(i)},${Y(v)}`).filter(Boolean).join(' ');
    const last=vals[vals.length-1];
    return `<div class="sp"><div class="h">${d.name}<b style="color:${kpiBad(w,d.k,last)?'var(--warn)':'var(--green)'}">${last}${d.unit}</b></div>
      <svg width="100%" height="${Hd}" viewBox="0 0 ${Wd} ${Hd}" preserveAspectRatio="none"><line x1="0" x2="${Wd}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e0563f" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <polyline points="${path}" fill="none" stroke="#2f6fd0" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg></div>`; }).join('')}</div>`;
}
function addKpi(){
  const d=$('#kpi-d').value; if(!d){ toast('請選擇日期','err'); return; }
  const rec={}; KPI_DEF.forEach(x=>{ const v=$('#kpi-'+x.k).value; if(v!=='') rec[x.k]=+v; });
  if(!Object.keys(rec).length){ toast('請至少輸入一項 KPI','err'); return; }
  ED.w.kpi=ED.w.kpi||{}; ED.w.kpi[d]=Object.assign({},ED.w.kpi[d]||{},rec); renderDrawer();
}
function onDrawerInput(e){
  const t=e.target; if(!ED) return;
  if(t.dataset.stepchk){ if(e.type!=='change') return; const id=t.dataset.stepchk, off=(ED.w.stepsOff||[]).filter(x=>x!==id);
    if(!t.checked){ if(stepsSorted().filter(s=>!off.includes(s.id)).length<=1){ t.checked=true; toast('至少要保留一個關卡','err'); return; } off.push(id); }
    if(off.length) ED.w.stepsOff=off; else delete ED.w.stepsOff; ED.stepDD=true; renderDrawer(); return; }

function saveLine(){

  const opBad=OPTICS.filter(o=>opSt(w,o.k)==='pend'&&opTouched(o)), opOld=OPTICS.filter(o=>opSt(w,o.k)==='pend'&&!opTouched(o));

  else toast('✅ 已儲存'+(ghReady()?'，幾秒後自動上傳':'（本機）'),'ok');

/** 從部門歷史推估每個階段的天數：階段最後一個關卡完成日 − 前一階段最後完成日（P 階段用第一個到最後一個關卡） */
function stageHistory(){
  const out={P:[],D:[],C:[]};
  for(const l of liveLines()){ const d=l.done||{}, st=lineSteps(l); let prevEnd=null;
    for(const k of ['P','D','C']){ const ss=st.filter(s=>s.stage===k); if(!ss.length||!ss.every(s=>d[s.id])) break;
      const ds=ss.map(s=>parseD(d[s.id])).filter(Boolean); const end=new Date(Math.max(...ds)), start=k==='P'?new Date(Math.min(...ds)):prevEnd;
      const days=Math.round((end-start)/864e5); if(days>0) out[k].push(days); prevEnd=end; } }
  const med=a=>{ const s=a.slice().sort((x,y)=>x-y); return s.length?s[Math.floor((s.length-1)/2)]:null; };
  return {P:{d:med(out.P),n:out.P.length},D:{d:med(out.D),n:out.D.length},C:{d:med(out.C),n:out.C.length}};

  const verdict=!items.length?'empty':(unlinked.length||!best||best.lvl==='no'||best.lvl==='shape')?'no':best.lvl==='dev'?'cond':'ok';
  const pool=liveLines().filter(l=>!g.onlyA||lineProg(l).stage==='A');
  const platLines=id=>pool.filter(l=>(l.sw||{}).plat===id);
  const itemRows=items.map(i=>({i,techs:itemTechs(i),okL:pool.filter(l=>itemCap(l,i.id).st==='ok')}));
  // 參考產線排序：已具備項目數（卡關扣分）→ 用建議版本 → 已量產 → 同產品別 → 同廠區 → 資料較新

function drawGantt(R){

  const W=box.clientWidth, LW=64, RH=26, TOP=22, H=TOP+3*RH+18;
  const t0=parseD(todayStr()), a=parseD(S.Ps)<t0?parseD(S.Ps):t0, b=parseD(S.golive);
  const start=new Date(a.getFullYear(),a.getMonth(),1), end=new Date(b.getFullYear(),b.getMonth()+1,1);
  const X=d=>LW+(d-start)/(end-start)*(W-LW-10);
  const months=(end.getFullYear()-start.getFullYear())*12+end.getMonth()-start.getMonth(), step=(W-LW)/months<34?2:1;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="inherit">`;
  for(let m=new Date(start),i=0;m<=end;m=new Date(m.getFullYear(),m.getMonth()+1,1),i++){ const x=X(m);
    s+=`<line x1="${x}" y1="${TOP-4}" x2="${x}" y2="${H-14}" stroke="${m.getMonth()===0?'#cfd8e6':'#eef2f7'}"/>`;
    if(m<end&&i%step===0) s+=`<text x="${x+3}" y="${TOP-8}" font-size="10" fill="#6b7a90">${m.getMonth()===0||i===0?m.getFullYear()+'/':''}${m.getMonth()+1}</text>`; }
  const bars=[['P',S.Ps,S.Ds],['D',S.Ds,S.Cs],['C',S.Cs,S.golive]];
  bars.forEach(([k,s0,s1],i)=>{ const y=TOP+i*RH, x0=X(parseD(s0)), x1=X(parseD(s1)), past=parseD(s0)<t0;
    s+=`<text x="2" y="${y+16}" font-size="11" font-weight="700" fill="#1c2b45">${k} ${STAGES[STG_IDX[k]].name}</text>
      <rect x="${x0}" y="${y+5}" width="${Math.max(2,x1-x0)}" height="${RH-10}" rx="4" fill="var(--s${k})" opacity="${past?.45:.9}"/>
      ${x1+78<W?`<text x="${x1+4}" y="${y+16}" font-size="10" fill="#6b7a90">${md(s0)}–${md(s1)}</text>`:`<text x="${x0-4}" y="${y+16}" font-size="10" fill="#6b7a90" text-anchor="end">${md(s0)}–${md(s1)}</text>`}`; });
  const gx=X(b), ty=TOP+3*RH;

  const tx=X(t0); s+=`<line x1="${tx}" y1="${TOP-4}" x2="${tx}" y2="${ty}" stroke="#e0563f" stroke-dasharray="3 3"/><text x="${tx+3}" y="${ty+12}" font-size="10" fill="#e0563f">今天</text>`;
  box.innerHTML=s+'</svg>'+(S.short>0?`<div class="muted" style="font-size:11px;color:var(--warn)">淡色部分 = 已經過去的時間（時程不足）</div>`:'');
}

function mSet(c,id,f,v){ const o=byId(c,id); if(!o) return; const n=clone(o); n[f]=v.trim(); if(eq(n,o)) return;
  commit(c,n,`主檔「${{sites:'廠區',products:'產品',items:'檢測項目',techs:'技術能力',plats:'軟體版本',forms:'型態',hws:'相機',steps:'PDCA 關卡'}[c]}」${c==='products'?prodFull(o):o.name||o.id} 的 ${{name:'名稱',short:'簡稱',latest:'最新版本號',region:'地區',owner:'負責人',shape:'形狀',cat:'類別',note:'說明',seg:'段別'}[f]||f} → ${f==='shape'?((PSHAPES.find(x=>x.k===v)||{}).t||v):c==='techs'&&f==='cat'?((TCATS.find(x=>x.k===v)||{}).t||v):v.trim()}`); }
function mAdd(c,o){ const n=Object.assign({id:uid(c[0]),order:c==='steps'?Math.max(0,...live('steps').filter(s=>s.stage===o.stage).map(s=>s.order||0))+1:nextOrder(c)},o);
  commit(c,n,`主檔新增：${o.name}`); setTimeout(()=>{ const ins=$$(`#pg-master input`).filter(x=>x.value===o.name); if(ins.length){ const i=ins[ins.length-1]; i.focus(); i.select(); } },30); }
async function mAddSite(){
  const code=await promptBox('新增廠區','廠區代碼（例：XM-S21、SZ-S08；建立後不可修改）','');
  if(!code) return; const id=code.trim().toUpperCase();
  if(byId('sites',id)&&!byId('sites',id).deleted){ toast('已有此廠區代碼','err'); return; }
  const region=(liveSorted('sites').find(s=>s.id.split('-')[0]===id.split('-')[0])||{}).region||id.split('-')[0];
  commit('sites',{id,name:id.split('-').slice(1).join('-')||id,region,owner:'',focus:'',next:'',order:nextOrder('sites')},`新增廠區 ${id}`);
}
function mMove(c,id,dir){
  // 跟畫面的排列方式一致：PDCA 關卡在同一階段內移動；技術能力在同一分類內移動；產品設定在同一段別內移動（畫面是先分組）
  const pseg=x=>(x.seg||'').trim();
  let arr=c==='steps'?stepsSorted().filter(s=>s.stage===byId('steps',id).stage):c==='techs'?techsSorted().filter(t=>tcat(t)===tcat(byId('techs',id))):c==='products'?prodsSorted().filter(p=>pseg(p)===pseg(byId('products',id))):liveSorted(c);
  const i=arr.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=arr.length){ if(c==='techs'||c==='steps'||c==='products') toast(`已經是這個${{techs:'分類',steps:'階段',products:'段別'}[c]}的${dir<0?'第一':'最後一'}項${c==='techs'?'；要換分類請改「分類」欄':c==='products'?'；產品設定依段別的製程順序排列':''}`); return; }
  [arr[i],arr[j]]=[arr[j],arr[i]];
  arr.forEach((x,k)=>{ if(x.order!==k+1){ const n=clone(x); n.order=k+1; commit(c,n,null); } });
}
async function mDel(c,id){
  const o=byId(c,id); const L=liveLines();
  const used={sites:L.filter(l=>l.site===id).length,products:L.filter(l=>lineProds(l).includes(id)).length,items:live('products').filter(p=>Object.values(p.fr||{}).some(a=>a.includes(id))).length,techs:L.filter(l=>lineTech(l,id)).length+live('items').filter(i=>(i.techs||[]).includes(id)).length,plats:L.filter(l=>(l.sw||{}).plat===id).length,forms:L.filter(l=>(l.forms||[]).includes(id)).length,hws:L.filter(l=>l.hw===id).length,steps:L.filter(l=>(l.done||{})[id]).length}[c];
  if(c==='sites'&&used){ toast(`廠區 ${id} 仍有 ${used} 條產線，請先移除或移轉`,'err'); return; }
  if(c==='products'&&used){ toast(`仍有 ${used} 條產線使用此產品，無法刪除`,'err'); return; }
  if(c==='plats'&&used){ toast(`仍有 ${used} 條產線使用此版本，請先改成其他版本`,'err'); return; }
  if(!(await confirmBox(`確定刪除「${o.name||o.id}」？${used?`\n目前有 ${used} 條產線有用到，刪除後這些資料將不再顯示。`:''}`,'刪除'))) return;
  removeEnt(c,id,`主檔刪除：${o.name||o.id}`);
}

  ${TCATS.map(g=>{ const ts=techs.filter(t=>tcat(t)===g.k); if(!ts.length) return '';
    return `<div class="pk-g"><span class="tcat-h tc-${g.k}">${g.k==='meas'||g.k==='det'?'演算法・':''}${g.t}</span>${note[g.k]?`<span class="muted pk-n">${note[g.k]}</span>`:''}</div>`+
    ts.map(t=>`<label class="pk-r"><input type="checkbox" value="${t.id}" ${sel.has(t.id)?'checked':''} onchange="pkPrev()"><span class="pk-t">${esc(t.name)}</span><span class="pk-d">${plats.map(p=>{ const s=techPlat(t,p.id); return `<i class="pkd pkd-${s||'no'}" title="${esc(p.name)}：${PST.find(x=>x.k===s).t}">${PSYM[s]}</i>`; }).join('')}</span></label>`).join(''); }).join('')||'<div class="empty">上方還沒有建立技術能力</div>'}</div>

function mJumpTech(iid,pid){
  const ts=itemTechs(byId('items',iid)); if(!ts.length){ toast('這個檢測項目還沒勾選需要的演算法'); return; }
  $$('#m-techs tr.flash').forEach(r=>r.classList.remove('flash')); $$('#m-techs td.hl').forEach(x=>x.classList.remove('hl'));
  const rows=ts.map(t=>document.getElementById('tr-'+t.id)).filter(Boolean);
  rows.forEach(r=>{ r.classList.add('flash'); const td=r.querySelector(`td[data-pid="${pid}"]`); if(td) td.classList.add('hl'); });
  if(rows[0]) rows[0].scrollIntoView({behavior:'smooth',block:'center'});
  clearTimeout(mJumpTech.t); mJumpTech.t=setTimeout(()=>{ rows.forEach(r=>r.classList.remove('flash')); $$('#m-techs td.hl').forEach(x=>x.classList.remove('hl')); },4000);
}
function mCyclePlat(tid,pid){

/** 資料架構升級：只補「缺少的欄位」，不覆蓋任何人改過的值。連線時在讀到雲端之後才執行，避免用舊資料蓋掉別人已設定好的內容 */
function migrateV2(){
  let n=0; const mark=(c,x)=>{ if(!has(DIRTY[c],x.id)) DIRTY[c][x.id]=clone(x); n++; };
  // v2.0：軟體版本、技術能力 × 版本、檢測項目 → 技術
  if(!DB.plats.length){ DEF_PLATS.forEach((x,i)=>{ const p={id:'v'+pad(i+1),name:x[0],forms:shapeForms(x[1]),note:'',order:i+1}; DIRTY.plats[p.id]=null; DB.plats.push(p); n++; }); }
  for(const t of DB.techs) if(!t.deleted&&!isObj(t.plat)){ mark('techs',t); t.plat=clone(DEF_TECH_PLAT[t.id]||{}); }
  for(const i of DB.items) if(!i.deleted&&!Array.isArray(i.techs)){ mark('items',i); i.techs=(DEF_ITEM_TECH[i.id]||[]).slice(); }
  // v2.1：型態、產品別、PDCA 8 關卡（只在第一次升級時做）
  if(!DB.forms.length){
    DEF_FORMS.forEach((x,i)=>{ const f={id:'f'+pad(i+1),name:x,req:[],order:i+1}; DIRTY.forms[f.id]=null; DB.forms.push(f); n++; });
    DEF_PRODS.forEach((x,i)=>{ if(byId('products',x[0])) return; const p={id:x[0],name:x[1],fr:clone(x[2]),order:i+1}; DIRTY.products[p.id]=null; DB.products.push(p); n++; });
    const oldIds=['s02','s04','s06','s07','s10','s14','s15'];
    if(oldIds.some(id=>{ const s=byId('steps',id); return s&&!s.deleted; })){
      const ord={s01:1,s03:2,s05:1,s08:2,s09:1,s11:2,s12:1,s13:2};
      DEF_STEPS.forEach(([id,stage,name,key])=>{ const s=byId('steps',id); if(!s||s.deleted) return; mark('steps',s); s.name=name; s.stage=stage; s.order=ord[id]; if(key) s.key=key; });
      oldIds.forEach(id=>{ const s=byId('steps',id); if(s&&!s.deleted){ mark('steps',s); s.deleted=true; s.updatedAt=new Date().toISOString(); } });
    }
  }
  for(const p of DB.plats) if(!p.deleted&&!Array.isArray(p.forms)){ mark('plats',p); p.forms=shapeForms(p.shape); delete p.shape; }
  // v2.3：技術能力分類、拆出「點線缺陷檢測 / Mura 檢測 / 色偏・色斑檢測」、檢測項目只連演算法、前處理改連型態
  if(DB.techs.some(t=>!t.deleted&&!t.cat)){
    for(const t of DB.techs) if(!t.deleted&&!t.cat){ mark('techs',t); t.cat=DEF_TECH_CAT[t.id]||'det'; }
    const add=(id,name,cat,src)=>{ if(byId('techs',id)) return; const s=byId('techs',src); const t={id,name,note:'',cat,plat:clone((s&&s.plat)||DEF_TECH_PLAT[id]||{}),order:+id.slice(1)}; DIRTY.techs[id]=null; DB.techs.push(t); n++; };
    add('t10','點線缺陷檢測','det','t01'); add('t11','Mura 檢測','det','t02'); add('t12','色偏 / 色斑檢測','det','t05');
    const MAP={t01:'t10',t02:'t11',t05:'t12'};
    for(const i of DB.items) if(!i.deleted&&Array.isArray(i.techs)){ const meas=isMeasItem(i);
      const nt=[...new Set(i.techs.map(id=>{ const t=byId('techs',id); if(!t) return null; const c=t.cat;
        if(c==='pre'||c==='post') return meas?null:(MAP[id]||null);
        if(!meas&&c==='meas') return MAP[id]||id;
        return id; }).filter(Boolean))];
      if(!eq(nt,i.techs)){ mark('items',i); i.techs=nt; } }
    for(const fm of DB.forms) if(!fm.deleted&&!Array.isArray(fm.pre)){ mark('forms',fm); fm.pre=(DEF_FORM_PRE[fm.id]||[]).filter(id=>byId('techs',id)); }
  }
  // v2.2：產品別 + 型態合併設定（fr）；產線改為可複選產品別，拿掉面板 / 相機台數
  for(const p of DB.products) if(!p.deleted&&!isObj(p.fr)){ mark('products',p); p.fr={};
    const used=new Set(['f01']); DB.lines.forEach(l=>{ if(!l.deleted&&lineProds(l).includes(p.id)) (l.forms||[]).forEach(f=>used.add(f)); });
    used.forEach(f=>{ const fm=byId('forms',f); if(!fm||fm.deleted) return; p.fr[f]=[...new Set([...(p.req||[]),...(fm.req||[])])].filter(i=>byId('items',i)); }); }
  for(const l of DB.lines) if(!l.deleted&&!Array.isArray(l.products)){ mark('lines',l); l.products=l.product?[l.product]:[]; delete l.panel; delete l.size; delete l.camN; }
  // 舊版產線：里程碑 → 關卡預計 / 完成日；下一步文字 → 下一步說明
  const kid=k=>(DB.steps.find(s=>s.key===k&&!s.deleted)||{}).id;
  for(const l of DB.lines) if(!l.deleted&&!isObj(l.plan)){ mark('lines',l); l.plan={}; l.done=l.done||{};
    for(const k of ['install','sat','golive']){ const m=(l.ms||{})[k], sid=kid(k); if(!m||!sid) continue; if(m.plan) l.plan[sid]=m.plan; if(m.actual&&!l.done[sid]) l.done[sid]=m.actual; }
    if(l.next&&l.next.text) l.nextNote=l.next.text;
    if(l.next&&l.next.due){ const cs=stepsSorted().find(s=>!l.done[s.id]); if(cs&&!l.plan[cs.id]) l.plan[cs.id]=l.next.due; }
    delete l.ms; delete l.next; if(!l.forms) l.forms=['f01']; }
  if(n) saveLocal();
  return n;
}

  const D=[
    {site:'XM-S11',prods:['NB'],line:'L1',forms:['f01'],hw:'61MP',plat:'v05',ver:'2.0.3_20260918',dn:7,owner:'A. Lin',vendor:'廠商 A',upd:2,kpi:true,off:['t08']},
    {site:'XM-S17',prods:['FIDM'],line:'L2',forms:['f03'],hw:'AIC61-80',plat:'v05',ver:'2.0.2_20260620',dn:4,owner:'B. Chen',vendor:'廠商 B',upd:5,blocked:'與人工目檢差異過大，重新定義判定規格'},

  const lines=[], log=[];

    steps.forEach((s,i)=>{ if(i<dn){ done[s.id]=addDays(T,-(dn-i)*25); plan[s.id]=addDays(done[s.id],-3); } else plan[s.id]=addDays(T,(i-dn)*30+(i===dn?(x.late?-6:12):20)); });

let SYNC={state:'off',msg:''};
const ghReady=()=>!!(GH&&GH.enabled&&GH.owner&&GH.repo&&GH.path&&GH.token);
const apiBase=()=>(GH.api||'https://api.github.com').replace(/\/+$/,'');
function ghHeaders(json){ const h={'Accept':'application/vnd.github+json'}; if(GH.token) h.Authorization='Bearer '+GH.token; if(json) h['Content-Type']='application/json'; return h; }
function ghUrl(){ return `${apiBase()}/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${GH.path.split('/').map(encodeURIComponent).join('/')}`; }
function withLock(fn){ const p=LOCK.then(fn,fn); LOCK=p.catch(()=>{}); return p; }

async function ghGet(){
  const r=await fetch(ghUrl()+'?ref='+encodeURIComponent(GH.branch||'main'),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404) return {sha:null,doc:null,missing:true};
  if(!r.ok) throw new Error(r.status===401?'401 權杖無效或過期':r.status===403?'403 權限不足或達到 API 上限':'HTTP '+r.status);
  const j=await r.json(); let b64=j.content;
  if(!b64&&j.sha){ // 超過 1MB 時 Contents API 不回傳內容，改走 blob API
    const br=await fetch(`${apiBase()}/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/git/blobs/${j.sha}`,{headers:ghHeaders(),cache:'no-store'});
    b64=(await br.json()).content; }
  return {sha:j.sha,doc:JSON.parse(b64decode(b64))};
}
async function ghPut(doc,sha,message){
  const body={message,content:b64encode(JSON.stringify(doc,null,1)),branch:GH.branch||'main'}; if(sha) body.sha=sha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:ghHeaders(true),body:JSON.stringify(body)});
  let j=null; try{ j=await r.json(); }catch(e){}
  return {ok:r.ok,status:r.status,sha:j&&j.content&&j.content.sha,msg:j&&j.message};
}

/** 3-way merge：base=我修改前的版本，l=我的版本，r=雲端最新版本。逐欄位：只有我改的欄位用我的，其餘用雲端。 */
function merge3(b,l,r,path,cf){
  if(eq(l,b)) return clone(r);
  if(eq(r,b)) return clone(l);
  if(eq(l,r)) return clone(l);
  if(isObj(l)&&isObj(r)){ const bb=isObj(b)?b:{}, out={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){ const v=merge3(bb[k],l[k],r[k],path?path+'.'+k:k,cf); if(v!==undefined) out[k]=v; }
    return out; }
  // 清單類欄位（勾選的演算法、檢測項目、型態、產品別…）逐項合併：我加的加上去、我取消的拿掉，其他人的勾選保留
  const prim=a=>Array.isArray(a)&&a.every(x=>x===null||typeof x!=='object');
  if(prim(l)&&prim(r)&&(b===undefined||b===null||prim(b))){
    const B=new Set(b||[]), L=new Set(l), add=l.filter(x=>!B.has(x)), del=new Set([...B].filter(x=>!L.has(x)));
    const out=r.filter(x=>!del.has(x)); add.forEach(x=>{ if(!out.includes(x)) out.push(x); }); return out; }
  if(!/(^|\.)(updatedAt|updatedBy)$/.test(path)) cf.push(path);
  return clone(l); // 同一欄位兩人都改 → 後儲存者為準（並提示）
}
/** 把雲端文件合併進本機：未修改的實體以雲端為準；我修改過的實體做 3-way merge */
function mergeRemote(remote){
  const conflicts=[];
  for(const c of COLLS){
    const rMap=new Map(((remote&&remote[c])||[]).map(x=>[x.id,x])), lMap=new Map(DB[c].map(x=>[x.id,x])), out=[];
    const ids=[...rMap.keys(),...[...lMap.keys()].filter(k=>!rMap.has(k))];
    for(const id of ids){
      const r=rMap.get(id), l=lMap.get(id);
      if(has(DIRTY[c],id)&&l!==undefined){
        if(r===undefined){ out.push(l); continue; }
        const cf=[], m=merge3(DIRTY[c][id]??undefined,l,r,'',cf);
        if(cf.length) conflicts.push({c,id,by:r.updatedBy,name:c==='lines'?r.site+' '+lineLabel(r):(r.name||r.id),fields:cf});
        out.push(m); DIRTY[c][id]=clone(r);
      } else if(r!==undefined) out.push(clone(r));
      else if(!remote) out.push(l);
    }
    DB[c]=out;
  }
  const lm=new Map(); for(const e of (remote&&remote.log)||[]) lm.set(e.id,e); for(const e of DB.log) if(!lm.has(e.id)) lm.set(e.id,e);
  DB.log=[...lm.values()].sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0).slice(-LOG_CAP);
  if(remote&&remote.meta){ DB.meta=Object.assign({},DB.meta,{updated:remote.meta.updated,updatedBy:remote.meta.updatedBy});
    if((remote.meta.demoGenAt||'')>(DB.meta.demoGenAt||'')){ DB.meta.demoGen=remote.meta.demoGen||''; DB.meta.demoGenAt=remote.meta.demoGenAt; } }
  if(remote) DB.log=DB.log.filter(e=>!e.demo||(e.demoGen&&e.demoGen===DB.meta.demoGen));
  if(remote&&remote.meta&&remote.meta.schema>SCHEMA) toast('⚠ 雲端資料格式比此版本新，請重新整理頁面以取得最新版','err',9000);
  return conflicts;
}
function buildDoc(includeDemo){
  const cut=Date.now()-90*864e5, d={meta:{app:'aoi-monitor',schema:SCHEMA,appVer:APP_VER,updated:new Date().toISOString(),updatedBy:USER.name||''}};
  if(DB.meta.demoGenAt){ d.meta.demoGen=DB.meta.demoGen||''; d.meta.demoGenAt=DB.meta.demoGenAt; }
  // 本機示範（無 gen）不上傳；已發布的示範與其刪除標記照常同步
  const pubDemo=x=>!x.demo||x.deleted||(x.demoGen&&x.demoGen===DB.meta.demoGen);
  for(const c of COLLS) d[c]=DB[c].filter(x=>(includeDemo||pubDemo(x))&&!(x.deleted&&new Date(x.updatedAt||0).getTime()<cut));
  d.log=DB.log.filter(e=>includeDemo||!e.demo||(e.demoGen&&e.demoGen===DB.meta.demoGen));
  return d;
}
function setSync(state,msg){
  SYNC={state,msg:msg||''};
  // 雲朵圖示（與 AOI Calculator 同一套）：用 SVG 而非 ☁ ⟳ ⚠ 字元，手機會把字元畫成彩色 emoji、顏色變不了
  const map={off:['rgba(255,255,255,.55)','cloud','雲端未連線（點此設定）'],ok:['#7CFFA8','cloud','雲端已同步'],sync:['#FFE08A','sync','同步中…'],
    err:['#FF9B8A','warn','同步失敗'],dirty:['#FFE08A','cloud','待上傳'],ro:['#9CC7FF','cloud','唯讀']};
  const a=map[state]||map.off, n=dirtyCount(), b=$('#syncBtn');
  const lb=(state==='ok'||state==='dirty')&&n?`待上傳 ${n} 筆`:state==='off'&&n?`雲端未連線 · 本機 ${n} 筆未上傳`:a[2];
  b.innerHTML=SYNC_IC[a[1]]; b.style.color=a[0]; b.setAttribute('aria-label',lb);
  b.title=lb+(msg&&msg!==lb?`\n${msg}`:'')+(GH.repo?`\n${GH.owner}/${GH.repo} · ${GH.path}`:'');
}
const SYNC_IC={cloud:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
  sync:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  warn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'};
/** 自動上傳：停止編輯 PUSH_IDLE（3 秒）後上傳；一直在編輯的話，從第一筆修改起最多 PUSH_MAX（15 秒）也會先送一次。期間的修改合併成一次上傳 */
function schedulePush(){ if(!ghReady()){ setSync('off'); return; } setSync('dirty','停止編輯幾秒後自動上傳（也可以按這裡 →「⬆ 立即上傳」）');
  const now=Date.now(); if(!PUSH_FIRST) PUSH_FIRST=now; clearTimeout(PUSH_T);
  PUSH_T=setTimeout(()=>{ PUSH_T=null; pushNow(); },Math.max(0,Math.min(PUSH_IDLE,PUSH_FIRST+PUSH_MAX-now))); }
/** 同步完成後重畫畫面；使用者正在輸入時先不重畫（避免打到一半的字被洗掉），離開欄位後再補畫 */
function syncRender(){ const a=document.activeElement; if(a&&a.closest&&a.closest('.page,#drawer')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ RENDER_PENDING=true; return; } RENDER_PENDING=false; renderAll(); }
function pullNow(opts){
  opts=opts||{}; if(!ghReady()){ setSync('off'); return Promise.resolve(); }
  return withLock(async()=>{
    setSync('sync','讀取雲端…');
    try{
      const {sha,doc,missing}=await ghGet(); LAST_PULL=Date.now();
      if(missing){ migrateV2(); setSync('ok','雲端尚無資料檔'); if(opts.init) offerInit(); return; }
      if(sha===GH_SHA&&!opts.force){ if(migrateV2()) renderAll(); setSync(dirtyCount()?'dirty':'ok','已是最新'); if(dirtyCount()) schedulePush(); return; }
      const cf=mergeRemote(doc); migrateV2(); GH_SHA=sha; localStorage.setItem(LS.sha,sha); saveLocal();
      setSync('ok',`已同步（雲端最後更新：${doc.meta&&doc.meta.updated?new Date(doc.meta.updated).toLocaleString('zh-TW',{hour12:false}):'—'} ${doc.meta&&doc.meta.updatedBy||''}）`);
      reportConflicts(cf); syncRender(); if(ED) renderDrawerNotice();
      if(dirtyCount()) schedulePush();
    }catch(e){ setSync('err','讀取失敗：'+e.message); if(opts.loud) toast('⚠ 雲端讀取失敗：'+e.message,'err'); }
  });
}
function pushNow(opts){
  opts=opts||{}; clearTimeout(PUSH_T); PUSH_T=null; PUSH_FIRST=0; if(!ghReady()){ setSync('off'); return Promise.resolve(); }
  return withLock(async()=>{
    try{
      for(let attempt=0;attempt<5;attempt++){
        setSync('sync','上傳中…');
        const {sha,doc,missing}=await ghGet();
        if(missing){ if(!opts.init){ setSync('ok','雲端尚無資料檔'); offerInit(); return; }
          for(const c of COLLS) for(const x of DB[c]) if(!x.demo&&!has(DIRTY[c],x.id)) DIRTY[c][x.id]=null; }
        if(!missing&&sha===GH_SHA&&!dirtyCount()&&!opts.force){ setSync('ok','已是最新'); return; }
        const remoteNew=!missing&&sha!==GH_SHA, cf=mergeRemote(doc); migrateV2();
        const out=buildDoc(false), snap={};
        for(const c of COLLS){ snap[c]={}; for(const id of Object.keys(DIRTY[c])){ const x=out[c].find(y=>y.id===id); if(x) snap[c][id]=clone(x); } }
        if(!dirtyCount()&&!missing&&!opts.force){ GH_SHA=sha; localStorage.setItem(LS.sha,sha); saveLocal(); setSync('ok'); reportConflicts(cf); renderAll(); return; }
        const lastT=localStorage.getItem(LS.lastPush)||'';
        const mine=DB.log.filter(e=>e.t>=lastT&&e.by===(USER.name||'未具名')).map(e=>(e.site?`[${e.site}] `:'')+e.msg);
        const message=`${USER.name||'未具名'}：${mine.slice(0,4).join('；').slice(0,180)||'更新資料'}${mine.length>4?` 等 ${mine.length} 項`:''}`;
        const res=await ghPut(out,sha,message);
        if(res.ok){
          GH_SHA=res.sha; localStorage.setItem(LS.sha,res.sha); localStorage.setItem(LS.lastPush,new Date().toISOString());
          for(const c of COLLS) for(const id of Object.keys(snap[c])){ const cur=byId(c,id); if(cur&&eq(cur,snap[c][id])) delete DIRTY[c][id]; else DIRTY[c][id]=snap[c][id]; }
          for(const c of COLLS) for(const id of Object.keys(DIRTY[c])) if(!byId(c,id)) delete DIRTY[c][id];
          saveLocal(); setSync(dirtyCount()?'dirty':'ok','已同步 '+new Date().toLocaleTimeString('zh-TW',{hour12:false}));
          reportConflicts(cf); if(remoteNew||missing) syncRender(); if(missing) toast('✅ 雲端資料檔已建立','ok');
          if(dirtyCount()) schedulePush();
          return;
        }
        if(res.status===409||res.status===422){ await new Promise(r=>setTimeout(r,400+Math.random()*800)); continue; } // 別人剛好也在存 → 重讀再合併
        if(res.status===403||res.status===404){ setSync('ro','此權杖沒有寫入權限（唯讀）：'+(res.msg||res.status)); toast('⚠ 上傳被拒：權杖沒有此 repo 的 Contents 寫入權限，修改只存在本機','err',8000); return; }
        throw new Error('HTTP '+res.status+' '+(res.msg||''));
      }
      throw new Error('多次重試仍衝突，稍後會自動再試');
    }catch(e){ setSync('err','上傳失敗：'+e.message+'（修改已保存在本機，稍後自動重試）'); }
  });
}
function reportConflicts(cf){
  if(!cf||!cf.length) return;
  const s=cf.slice(0,2).map(x=>`${x.name}（${x.fields.slice(0,3).join(', ')}）`).join('、');
  toast(`⚠ 你和 ${cf[0].by||'其他人'} 同時修改了 ${s}${cf.length>2?' 等':''}；同一欄位以你的版本為準，其他欄位已合併。`,'err',9000);
}
function renderDrawerNotice(){ if(!ED||ED.isNew) return; const cur=byId('lines',ED.w.id); if(cur&&cur.updatedAt!==ED.orig.updatedAt&&!$('#drawer .notice')) renderDrawer(); }
async function offerInit(){
  if(await confirmBox(`雲端 repo「${GH.owner}/${GH.repo}」中還沒有資料檔「${GH.path}」。\n\n要用這台電腦目前的主檔與產線資料（不含示範資料）建立嗎？\n（第一位設定的人做一次即可；其他同仁請確認路徑是否正確）`,'建立雲端資料檔')) pushNow({init:true});
}

let MD_RES=null;
function openModal(html,wide){ const m=$('#modal'); m.className=wide?'wide on':'on'; m.innerHTML=html; $('#md-ov').classList.add('on'); setTimeout(()=>{ const f=$('#modal input:not([type=checkbox]),#modal textarea'); if(f) f.focus(); },30); }
function closeModal(v){ $('#modal').className=''; $('#md-ov').classList.remove('on'); if(MD_RES){ const r=MD_RES; MD_RES=null; r(v); } guideHintSoon(); }
function confirmBox(msg,okText){ return new Promise(res=>{ MD_RES=res; openModal(`<div class="md-h"><b>確認</b><button class="x" onclick="closeModal(false)">✕</button></div>
  <div style="font-size:13px;line-height:1.7;white-space:pre-line;margin:6px 0 4px">${esc(msg)}</div>
  <div class="md-b"><span class="r"><button class="btn" onclick="closeModal(false)">取消</button><button class="btn pri" onclick="closeModal(true)">${esc(okText||'確定')}</button></span></div>`); }); }
function promptBox(title,label,val){ return new Promise(res=>{ MD_RES=res; openModal(`<div class="md-h"><b>${esc(title)}</b><button class="x" onclick="closeModal(null)">✕</button></div>
  <div class="md-f"><label>${esc(label)}</label><input class="in" id="pb-v" value="${esc(val||'')}" onkeydown="if(event.key==='Enter')closeModal(this.value)"></div>
  <div class="md-b"><span class="r"><button class="btn" onclick="closeModal(null)">取消</button><button class="btn pri" onclick="closeModal($('#pb-v').value)">確定</button></span></div>`); }); }

async function testCloud(){
  const el=$('#cl-msg'), g=readCloudForm(); const say=(c,t)=>{ el.style.color=c; el.textContent=t; };
  if(!g.owner||!g.repo||!g.token){ say('var(--warn)','⚠ 請先填寫 owner / repo / 權杖'); return; }
  say('var(--amber)','⟳ 測試中…');
  const base=(g.api||'https://api.github.com').replace(/\/+$/,''), H={'Accept':'application/vnd.github+json','Authorization':'Bearer '+g.token};
  try{
    const rr=await fetch(`${base}/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`,{headers:H,cache:'no-store'});
    if(rr.status===401) return say('var(--warn)','⚠ 401：權杖無效或已過期');
    if(rr.status===404) return say('var(--warn)',`⚠ 找不到 repo「${g.owner}/${g.repo}」：請檢查名稱大小寫，或權杖是否有包含這個 repo`);
    if(!rr.ok) return say('var(--warn)','⚠ HTTP '+rr.status);
    const repo=await rr.json(), canWrite=!repo.permissions||repo.permissions.push;
    const fr=await fetch(`${base}/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/${g.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(g.branch)}`,{headers:H,cache:'no-store'});
    const priv=repo.private?'':'　⚠ 注意：此 repo 是公開的！';
    if(fr.status===200) return say(priv?'var(--warn)':'var(--green)',`✅ 連線成功，已找到資料檔。${canWrite?'可讀寫':'（唯讀）'}${priv}`);
    if(fr.status===404) return say(priv?'var(--warn)':'var(--green)',`✅ repo 可存取，但還沒有資料檔（儲存設定後可建立）。${canWrite?'':'（唯讀，無法建立）'}${priv}`);
    say('var(--warn)','⚠ 讀取資料檔 HTTP '+fr.status);
  }catch(e){ say('var(--warn)','⚠ 連線失敗：'+e.message+'（若在大陸廠區，可能是網路無法連到 GitHub）'); }
}
